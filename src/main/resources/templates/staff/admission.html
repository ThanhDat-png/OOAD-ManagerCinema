<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell(~{::main})}"><body>

<main class="counter"><header class="counter-title"><div><h1>Kiểm tra và xác nhận vé</h1><p>Tra cứu vé và xác nhận khách vào đúng suất chiếu.</p></div></header>
<p class="st-error" role="alert" th:if="${staffError}" th:text="${staffError}"></p><p class="st-ok" role="status" th:if="${staffNotice}" th:text="${staffNotice}"></p>
<div class="st-sale-grid"><section class="st-panel"><h2>Kiểm tra vé tại cửa</h2>
<form class="st-stack" action="/staff/admission" id="admission-check"><div class="st-filters"><label>Ngày chiếu<input type="date" required name="day" th:value="${day}"></label><button class="st-quiet" name="step" value="" type="submit">Tải suất chiếu</button></div>
<label>Phòng đang kiểm soát<select name="room"><option value="">Chọn phòng chiếu</option><option th:each="r : ${rooms}" th:value="${r.MaPhong}" th:text="${r.TenPhong}" th:selected="${r.MaPhong==room}"></option></select></label>
<label>Suất chiếu đang kiểm soát<select name="show"><option value="">Chọn suất chiếu</option><option th:each="s : ${shows}" th:value="${s.MaSuat}" th:attr="data-room=${s.MaPhong}" th:text="${s.Gio+' · '+s.TenPhim+' · '+s.TenPhong}" th:selected="${s.MaSuat==show}"></option></select></label>
<label>Mã vé hoặc mã QR<input name="code" th:value="${code}" placeholder="Quét mã QR hoặc nhập mã vé" maxlength="100" autocomplete="off"></label><div class="st-actions"><button class="st-btn" name="step" value="lookup">Tra cứu vé</button><button class="st-quiet" name="step" value="check">Kiểm tra tính hợp lệ</button></div></form>
<details class="st-day"><summary>Quét mã QR từ ảnh</summary><form class="st-stack" method="post" th:action="@{/staff/admission/read}" enctype="multipart/form-data"><input type="hidden" name="day" th:value="${day}"><input type="hidden" name="room" th:value="${room}"><input type="hidden" name="show" th:value="${show}"><label>Ảnh mã QR<input type="file" accept="image/*" capture="environment" name="photo" required></label><button class="st-quiet">Đọc mã QR</button></form></details></section>
<aside class="st-panel st-cart"><h2>Thông tin vé</h2><p class="st-empty" th:if="${ticket==null}">Thông tin vé sẽ hiển thị sau khi tra cứu.</p>
<th:block th:if="${ticket!=null}"><p th:if="${valid}" class="st-ok" role="status">Vé hợp lệ</p><h3 th:text="${ticket.TenPhim}"></h3><dl class="st-facts"><div><dt>Mã vé</dt><dd th:text="${ticket.MaVe}"></dd></div><div><dt>Phòng chiếu</dt><dd th:text="${ticket.TenPhong}"></dd></div><div><dt>Suất chiếu</dt><dd th:text="${ticket.Lich}"></dd></div><div><dt>Ghế</dt><dd th:text="${ticket.Cho}"></dd></div><div><dt>Loại ghế</dt><dd th:text="${ticket.TenLoaiGheLucPhatHanh}"></dd></div><div><dt>Giá vé</dt><dd th:text="${#numbers.formatInteger(ticket.GiaVe,1,'POINT')+' ₫'}"></dd></div><div><dt>Thanh toán</dt><dd th:text="${ticket.DaThanhToan == 1 ? 'Đã thanh toán' : 'Chưa thanh toán'}"></dd></div><div><dt>Trạng thái</dt><dd th:text="${ticket.TrangThai}"></dd></div></dl>
<form class="st-actions" method="post" th:if="${valid}" th:action="@{/staff/admission/confirm}"><input type="hidden" name="id" th:value="${ticket.MaVe}"><input type="hidden" name="show" th:value="${show}"><input type="hidden" name="room" th:value="${room}"><input type="hidden" name="day" th:value="${day}"><button class="st-btn">Xác nhận</button><a class="st-link" th:href="@{/staff/admission(room=${room},show=${show},day=${day})}">Hủy xác nhận</a></form></th:block>
<p class="st-meta" th:text="${'Cho phép vào từ '+window.truocPhut()+' phút trước đến '+window.sauPhut()+' phút sau giờ bắt đầu.'}"></p></aside></div><script src="/web/staff.js" defer></script></main>
</body></html>
