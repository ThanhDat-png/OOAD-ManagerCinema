<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell(~{::main})}"><body>

<main class="counter receipt"><header class="counter-title"><div><h1>Chi tiết giao dịch</h1><p th:if="${order!=null}" th:text="${order.MaGiaoDich}"></p></div><a class="st-link" href="/staff/transactions">← Tra cứu giao dịch</a></header>
<p class="st-error" role="alert" th:if="${staffError}" th:text="${staffError}"></p><p class="st-ok" role="status" th:if="${staffNotice}" th:text="${staffNotice}"></p>
<th:block th:if="${order!=null}"><section class="st-panel"><div class="st-between"><h2>Thông tin giao dịch</h2><span class="st-status" th:text="${order.TrangThai}"></span></div>
<dl class="st-facts"><div><dt>Nhân viên</dt><dd th:text="${order.HoTen}"></dd></div><div><dt>Thời gian tạo</dt><dd th:text="${order.ThoiGianTao}"></dd></div><div><dt>Phương thức thanh toán</dt><dd th:text="${order.PhuongThuc ?: 'Chưa ghi nhận'}"></dd></div><div><dt>Tổng tiền</dt><dd th:text="${#numbers.formatInteger(order.TongTien,1,'POINT')+' ₫'}"></dd></div></dl>
<form method="post" th:if="${own and (order.TrangThai=='Chờ thanh toán' or order.TrangThai=='Đang thanh toán')}" th:action="@{/staff/transactions/{id}/resume(id=${order.MaGiaoDich})}"><button class="st-btn">Tiếp tục xử lý giao dịch</button></form></section>
<section class="st-panel ticket-panel"><div class="st-between"><h2>Vé đã phát hành</h2><button class="st-btn" data-print-tickets th:if="${!tickets.isEmpty()}" type="button">In vé</button></div><p class="st-empty" th:if="${tickets.isEmpty()}">Giao dịch chưa có vé được phát hành.</p>
<form method="post" th:if="${own and order.TrangThai=='Đã thanh toán' and tickets.size() lt heldSeats.size()}" th:action="@{/staff/transactions/{id}/issue(id=${order.MaGiaoDich})}"><button class="st-btn">Phát hành vé</button></form>
<div class="st-ticket-list"><article class="st-ticket" th:each="ticket : ${tickets}"><div><p class="st-meta">Vé xem phim</p><h3 th:text="${ticket.TenPhim}"></h3><p th:text="${ticket.TenPhong+' · '+ticket.Lich}"></p><p><strong th:text="${'Ghế '+ticket.Cho}"></strong> <span th:text="${'· '+ticket.TenLoaiGheLucPhatHanh}"></span></p><p th:text="${#numbers.formatInteger(ticket.GiaVe,1,'POINT')+' ₫ · '+ticket.TrangThai}"></p><small th:text="${ticket.MaVe}"></small></div><img width="118" height="118" th:src="@{/staff/tickets/{id}/qr(id=${ticket.MaVe})}" alt="Mã QR của vé"></article></div></section>
<div class="st-actions"><form method="post" th:if="${order.MaGiaoDich==session.saleId and order.TrangThai=='Đã thanh toán'}" th:action="@{/staff/sales/new}"><input type="hidden" name="id" th:value="${order.MaGiaoDich}"><button class="st-btn">Giao dịch mới</button></form><a class="st-link" href="/staff/sales">Về quầy bán vé</a></div></th:block><script src="/web/staff.js" defer></script></main>
</body></html>
